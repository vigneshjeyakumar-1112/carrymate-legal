<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anvias | Coming soon</title>
<meta name="description" content="Anvias is working on something new. Coming soon.">
<style>
  :root {
    --bg: #f6f7f5;
    --text: #1a1a1a;
    --muted: #666b66;
    --accent: #0a7a5a;
    --line: #dfe3df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101412;
      --text: #f0f2f0;
      --muted: #9aa39c;
      --accent: #3ecf9c;
      --line: #26302a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 520px; }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: var(--accent);
    margin: 0 auto 24px;
  }
  h1 {
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    letter-spacing: 0.04em;
    margin: 0 0 12px;
  }
  .tag {
    font-size: 1.15rem;
    margin: 0 0 8px;
  }
  .sub {
    color: var(--muted);
    margin: 0;
    line-height: 1.6;
  }
  footer {
    margin-top: 48px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); text-decoration: none; margin: 0 8px; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Anvias</h1>
    <p class="tag">Something new is on its way.</p>
    <p class="sub">We’re working on our first app. Please check back soon.</p>
  </main>
  <footer>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="terms.html">Terms</a>
    <a href="refund-policy.html">Refund Policy</a>
  </footer>
</body>
</html>
